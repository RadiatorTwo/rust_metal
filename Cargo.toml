[package]
name = "rust_metal"
version = "0.1.0"
edition = "2024"
description = "Gun Metal (2002) recompiled to native code with Cranelift"
license = "MIT"

[[bin]]
name = "gunmetal"
path = "src/main.rs"

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
sha2 = "0.11.1"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# assembling test snippets
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info", "code_asm"] }
